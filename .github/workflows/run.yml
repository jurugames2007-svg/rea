name: Auto Repomix Remote

on:
  workflow_dispatch:

jobs:
  repomix:
    runs-on: ubuntu-latest
    steps:
      # Paso clave: Clonamos el repositorio para que los archivos existan físicamente
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Ejecutamos repomix localmente y forzamos la creación del XML
      - name: Run Repomix Local
        run: npx repomix --format xml

      # Subimos el archivo real generado en el paso anterior
      - name: Upload Repomix Output
        uses: actions/upload-artifact@v4
        with:
          name: repomix-output
          path: repomix-output.xml
