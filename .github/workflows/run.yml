name: Auto Repomix Local (All Content)

on:
  workflow_dispatch:

jobs:
  repomix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Descarga rápida sin historial de commits pesados

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Repomix on Whole Repository
        # Forzamos a Node a usar hasta 6GB de la memoria del runner y desactivamos los bloqueos de seguridad
        run: |
          NODE_OPTIONS="--max-old-space-size=6144" npx repomix \
            --format xml \
            --no-security-check \
            --include "**/*"

      - name: Upload Repomix Output
        uses: actions/upload-artifact@v4
        with:
          name: repomix-output
          path: repomix-output.xml
